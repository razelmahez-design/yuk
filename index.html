<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Kas Kelas XI IPS 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">
    <div class="w-full max-w-md md:max-w-xl px-4 pt-4">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-900 to-blue-700 rounded-3xl p-6 shadow-xl text-white mb-6">
            <h1 class="text-xl font-extrabold flex items-center gap-2">💰 Monitoring Kas Kelas XI IPS 1</h1>
            <p class="text-xs text-blue-200 mt-1">Dashboard bendahara kelas • Tahun 2026</p>
        </header>

        <!-- 4 Kartu Statistik -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-[11px] text-slate-500 font-medium">Saldo Kas Saat Ini</p>
                <h2 id="saldoKas" class="text-lg font-bold text-slate-800 mt-1">Rp 0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-[11px] text-slate-500 font-medium">Total Pemasukan</p>
                <h2 id="totalPemasukan" class="text-lg font-bold text-slate-800 mt-1">Rp 0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-[11px] text-slate-500 font-medium">Total Pengeluaran</p>
                <h2 id="totalPengeluaran" class="text-lg font-bold text-slate-800 mt-1">Rp 0</h2>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-[11px] text-slate-500 font-medium">Jumlah Siswa</p>
                <h2 id="jumlahSiswa" class="text-lg font-bold text-slate-800 mt-1">0</h2>
            </div>
        </div>

        <!-- Menu Navigasi Tombol -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button class="bg-white border border-slate-200 py-3 px-2 rounded-2xl text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50">Dashboard</button>
            <button class="bg-blue-600 text-white py-3 px-2 rounded-2xl text-xs font-semibold shadow-md">Data Siswa</button>
            <button class="bg-white border border-slate-200 py-3 px-2 rounded-2xl text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50">Pembayaran</button>
            <button class="bg-white border border-slate-200 py-3 px-2 rounded-2xl text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50">Pemasukan</button>
            <button class="bg-white border border-slate-200 py-3 px-2 rounded-2xl text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50">Rekap Bulanan</button>
            <button class="bg-white border border-slate-200 py-3 px-2 rounded-2xl text-xs font-semibold text-slate-600 shadow-sm hover:bg-slate-50">Backup Data</button>
        </div>

        <!-- Bagian Data Siswa -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-6">
            <h2 class="font-bold text-base text-slate-800 mb-4">Data Siswa</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="inputNamaSiswa" placeholder="Nama lengkap siswa" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
                <button id="btnTambahSiswa" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm whitespace-nowrap">Tambah Siswa</button>
            </div>
            <div class="mb-4">
                <input type="text" id="cariSiswa" placeholder="Cari nama siswa..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Tabel Siswa -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-[11px] text-slate-400 uppercase">
                            <th class="py-2 px-2">No.</th>
                            <th class="py-2 px-2">Nama Siswa</th>
                        </tr>
                    </thead>
                    <tbody id="tabelSiswaBody" class="text-xs text-slate-700">
                        <tr>
                            <td colspan="2" class="py-4 text-center text-slate-400">Memuat data siswa...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase & Script Utama -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa62ZI1V6L6At5RqnRCM9xzauthDomain",
            authDomain: "kas-kelas-xi-ips-1-f50b6.firebaseapp.com",
            projectId: "kas-kelas-xi-ips-1-f50b5",
            storageBucket: "kas-kelas-xi-ips-1-f50b6.appspot.com",
            messagingSenderId: "483576265630",
            appId: "1:483576265630:web:dd84b4f7aeed478ae1b48f",
            measurementId: "G-H2MBCYXCN2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function muatData() {
            const tbody = document.getElementById('tabelSiswaBody');
            try {
                const querySnapshot = await getDocs(collection(db, "siswa"));
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="2" class="py-4 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
                    document.getElementById('jumlahSiswa').innerText = '0';
                    return;
                }

                let html = '';
                let no = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <tr class="border-b border-slate-50 hover:bg-slate-50">
                            <td class="py-3 px-2 font-medium">${no++}</td>
                            <td class="py-3 px-2 font-semibold text-slate-800">${data.nama || '-'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
                document.getElementById('jumlahSiswa').innerText = querySnapshot.size;
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="2" class="py-4 text-center text-red-500">Gagal memuat database.</td></tr>`;
            }
        }

        muatData();
    </script>
</body>
</html>
