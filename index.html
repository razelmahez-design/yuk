<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Kelas XI IPS 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f3f4f6; }
        .bg-gradient-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #1d4ed8 100%); }
        .bg-gradient-card { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.5); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(75, 85, 99, 0.5); border-radius: 8px; }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">
    <div class="w-full max-w-md md:max-w-xl px-4 pt-4">
        <!-- Header -->
        <header class="bg-gradient-header rounded-3xl p-6 shadow-xl text-white relative overflow-hidden mb-6">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Kas Kelas XI IPS 1</h1>
                    <p class="text-xs text-blue-100/80 mt-1 flex items-center gap-1.5">
                        <span id="syncStatus" class="w-2 h-2 rounded-full bg-emerald-400"></span> Terhubung ke Cloud
                    </p>
                </div>
            </div>

            <!-- Filter Tahun & Bulan -->
            <div class="grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="text-[10px] uppercase tracking-wider text-blue-200 font-semibold mb-1 block">Pilih Tahun</label>
                    <select id="filterTahun" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                        <option value="2026" class="bg-slate-900 text-white">2026</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] uppercase tracking-wider text-blue-200 font-semibold mb-1 block">Pilih Bulan</label>
                    <select id="filterBulan" class="w-full bg-white/10 border border-white/20 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                        <option value="1" class="bg-slate-900 text-white">Januari</option>
                        <option value="2" class="bg-slate-900 text-white">Februari</option>
                        <option value="3" class="bg-slate-900 text-white">Maret</option>
                        <option value="4" class="bg-slate-900 text-white">April</option>
                        <option value="5" class="bg-slate-900 text-white">Mei</option>
                        <option value="6" class="bg-slate-900 text-white">Juni</option>
                        <option value="7" class="bg-slate-900 text-white">Juli</option>
                        <option value="8" class="bg-slate-900 text-white">Agustus</option>
                        <option value="9" class="bg-slate-900 text-white">September</option>
                        <option value="10" class="bg-slate-900 text-white">Oktober</option>
                        <option value="11" class="bg-slate-900 text-white">November</option>
                        <option value="12" class="bg-slate-900 text-white">Desember</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Kartu Total Saldo -->
        <div class="bg-gradient-card rounded-3xl p-6 shadow-xl text-white mb-6">
            <p class="text-xs uppercase tracking-wider text-blue-200 font-semibold mb-1">Total Saldo Kas</p>
            <h2 id="totalSaldo" class="text-3xl font-black mb-4">Rp 0</h2>
            <div class="grid grid-cols-2 gap-4 pt-3 border-t border-white/10">
                <div>
                    <p class="text-[11px] text-blue-200">Pemasukan</p>
                    <p id="totalPemasukan" class="text-sm font-bold">Rp 0</p>
                </div>
                <div>
                    <p class="text-[11px] text-blue-200">Pengeluaran</p>
                    <p id="totalPengeluaran" class="text-sm font-bold">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Progress Bulanan -->
        <div class="glass-panel rounded-2xl p-4 mb-6 shadow-lg">
            <div class="flex justify-between text-xs font-semibold mb-2">
                <span class="text-slate-300">Progres Iuran Kas Bulan Ini</span>
                <span id="persenProgres" class="text-blue-400">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden mb-2">
                <div id="progressBar" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-[11px] text-slate-400">
                <span id="infoSesi">0 dari 0 Sesi Terbayar</span>
                <span>Rp 5.000 / minggu</span>
            </div>
        </div>

        <!-- Menu Navigasi Tab -->
        <div class="flex bg-slate-800/80 p-1.5 rounded-2xl mb-6 border border-slate-700/50">
            <button id="tabSiswaBtn" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-md">Siswa & Kas</button>
            <button id="tabTransaksiBtn" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white">Transaksi</button>
        </div>

        <!-- Konten Tab Siswa -->
        <div id="contentSiswa" class="space-y-4">
            <div class="flex gap-2">
                <input type="text" id="searchSiswa" placeholder="Cari nama siswa..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <select id="filterStatusSiswa" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="semua">Semua Status</option>
                    <option value="lunas">Lunas Semua</option>
                    <option value="belum">Belum Lunas</option>
                </select>
            </div>

            <!-- Daftar Siswa Container -->
            <div id="daftarSiswa" class="space-y-3 mt-4">
                <p class="text-center text-xs text-slate-500 py-6">Memuat data siswa...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Logika Koneksi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa62ZI1V6L6At5RqnRCM9xzauthDomain",
            authDomain: "kas-kelas-xi-ips-1-f50b6.firebaseapp.com",
            projectId: "kas-kelas-xi-ips-1-f50b5",
            storageBucket: "kas-kelas-xi-ips-1-f50b6.appspot.com",
            messagingSenderId: "483576265630",
            appId: "1:483576265630:web:dd84b4f7aeed478ae1b48f",
            measurementId: "G-H2MBCYXCN2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("Firebase initialized successfully!");

        const currentMonth = new Date().getMonth() + 1;
        document.getElementById('filterBulan').value = currentMonth;
    </script>
</body>
</html>
